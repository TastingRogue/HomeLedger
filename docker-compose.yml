# =============================================================================
# HomeLedger - Docker Compose (local development)
# Backend API: http://localhost:3000
# Frontend:    http://localhost:5173
# =============================================================================
services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: homeledger-backend
    restart: unless-stopped
    command: npx tsx watch packages/backend/src/server.ts
    ports:
      - "${BACKEND_PORT:-3000}:3000"
    volumes:
      - homeledger-data:/data
    environment:
      NODE_ENV: development
      PORT: 3000
      HOST: 0.0.0.0
      DATA_DIR: /data
      JWT_SECRET: ${JWT_SECRET:-change-me-to-a-strong-random-secret}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@homeledger.local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-change-me-to-a-strong-password}
      TZ: ${TZ:-America/Mexico_City}
      # Primary language for the install (system categories + default UI
      # language): 'es' or 'en'. Falls back to English. Users can still switch.
      DEFAULT_LOCALE: ${DEFAULT_LOCALE:-en}
      # Single display currency for the whole install (no conversion in v1).
      DISPLAY_CURRENCY: ${DISPLAY_CURRENCY:-MXN}
      # Automated backups: gzip whole-DB snapshots under /data/backups, keeping
      # the newest BACKUP_RETENTION. Disable with BACKUP_ENABLED=false.
      BACKUP_ENABLED: ${BACKUP_ENABLED:-true}
      BACKUP_RETENTION: ${BACKUP_RETENTION:-7}
      BACKUP_CRON: ${BACKUP_CRON:-0 3 * * *}
      # Registration policy (seeds on first run; admin can change in-app).
      # first_user_only (safe default) | open | closed
      REGISTRATION_MODE: ${REGISTRATION_MODE:-first_user_only}
      REGISTRATION_ALLOWLIST: ${REGISTRATION_ALLOWLIST:-}
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:3000/api/v1/health >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: homeledger-frontend
    restart: unless-stopped
    command: npm run dev -w packages/frontend -- --host 0.0.0.0
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    environment:
      NODE_ENV: development
      VITE_API_PROXY_TARGET: http://backend:3000
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:5173/ >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  homeledger-data:
    driver: local
