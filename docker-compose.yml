# =============================================================================
# HomeLedger - Docker Compose
# Single-container production deployment: Fastify API + SvelteKit frontend
# Usage: docker compose up --build -d
#
# Environment variables (set in .env or via CLI):
#   PORT: Application port (default: 3000)
#   JWT_SECRET: JWT signing secret (required for production)
#   ADMIN_EMAIL: Initial admin email
#   ADMIN_PASSWORD: Initial admin password
#   TZ: Timezone (default: America/Mexico_City)
# =============================================================================

services:
  homeledger:
    build:
      context: .
      dockerfile: Dockerfile
      # Uncomment for multi-arch builds
      # platforms:
      #   - linux/amd64
      #   - linux/arm64
    container_name: homeledger
    restart: unless-stopped

    # Fastify serves both the API and the SvelteKit frontend.
    ports:
      - "${PORT:-3000}:3000"

    # Persistent storage for SQLite database and attachments.
    volumes:
      - homeledger-data:/data

    environment:
      NODE_ENV: production
      PORT: 3000
      HOST: 0.0.0.0
      DATA_DIR: /data
      JWT_SECRET: ${JWT_SECRET:-change-me-to-a-strong-random-secret}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@homeledger.local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-change-me-to-a-strong-password}
      TZ: ${TZ:-America/Mexico_City}

    # Check both the API and the frontend. This prevents Docker Desktop from
    # reporting a backend-only container as healthy when the UI is unavailable.
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:3000/api/v1/health >/dev/null && curl -fsS http://localhost:3000/ >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

    # Resource limits (optional)
    # deploy:
    #   resources:
    #     limits:
    #       cpus: '1'
    #       memory: 1G
    #     reservations:
    #       cpus: '0.5'
    #       memory: 512M

volumes:
  homeledger-data:
    driver: local
