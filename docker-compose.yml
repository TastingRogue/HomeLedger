# =============================================================================
# HomeLedger - Docker Compose (local development)
# Backend API: http://localhost:3000
# Frontend:    http://localhost:5173
# =============================================================================
services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: homeledger-backend
    restart: unless-stopped
    command: npm run dev -w packages/backend
    ports:
      - "${BACKEND_PORT:-3000}:3000"
    volumes:
      - homeledger-data:/data
    environment:
      NODE_ENV: development
      PORT: 3000
      HOST: 0.0.0.0
      DATA_DIR: /data
      JWT_SECRET: ${JWT_SECRET:-change-me-to-a-strong-random-secret}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@homeledger.local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-change-me-to-a-strong-password}
      TZ: ${TZ:-America/Mexico_City}
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:3000/api/v1/health >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: homeledger-frontend
    restart: unless-stopped
    command: npm run dev -w packages/frontend -- --host 0.0.0.0
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    environment:
      NODE_ENV: development
      VITE_API_PROXY_TARGET: http://backend:3000
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:5173/ >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  homeledger-data:
    driver: local
