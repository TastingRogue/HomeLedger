name: CI

# Quality gates that protect `main`: typecheck, lint, tests, and a build.
# Runs on every push and pull request. Kept separate from the Docker image
# workflow so these checks run even when the image isn't rebuilt.

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        # `npm ci` on Linux can skip rollup's platform-specific optional binary
        # (@rollup/rollup-linux-x64-gnu) due to a long-standing npm bug with
        # optionalDependencies (npm/cli#4828). When that binary is missing,
        # svelte-check/vite fail with "Cannot find module @rollup/rollup-linux-x64-gnu".
        # Explicitly (re)install it after the clean install so the native module
        # is present. The version is pinned to match the lockfile's rollup.
        run: |
          npm ci
          npm install --no-save @rollup/rollup-linux-x64-gnu@4.62.5

      - name: Build shared package
        run: npm run build -w packages/shared

      - name: Typecheck (backend)
        run: npm run typecheck -w packages/backend

      - name: Typecheck (frontend)
        run: npm run typecheck -w packages/frontend

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
