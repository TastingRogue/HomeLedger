name: CI

# Quality gates that protect `main`: typecheck, lint, tests, and a build.
# Runs on every push and pull request. Kept separate from the Docker image
# workflow so these checks run even when the image isn't rebuilt.

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build shared package
        run: npm run build -w packages/shared

      - name: Typecheck (backend)
        run: npm run typecheck -w packages/backend

      - name: Typecheck (frontend)
        run: npm run typecheck -w packages/frontend

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
