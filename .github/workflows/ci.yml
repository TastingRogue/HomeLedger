name: CI

# Quality gates that protect `main`: typecheck, lint, tests, and a build.
# Runs on every push and pull request. Kept separate from the Docker image
# workflow so these checks run even when the image isn't rebuilt.

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify language packs and generated integrations
        run: npm run locales:check && npm run locales:test

      - name: Build shared package
        run: npm run build -w packages/shared

      - name: Typecheck (backend)
        run: npm run typecheck -w packages/backend

      - name: Typecheck (frontend)
        run: npm run typecheck -w packages/frontend

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Verify production themes
        run: node scripts/check-theme-build.mjs

      - name: Verify Pages resources
        run: node scripts/check-pages.mjs

      - name: Check dependencies (including build tools)
        run: |
          node --test scripts/check-dependencies.test.mjs
          node scripts/check-dependencies.mjs
          npm audit --omit=dev

      - name: Check Home Assistant options and currencies
        run: python3 scripts/check-ha.py

      - name: Verify isolated runtime workflows
        shell: bash
        run: |
          export DATA_DIR="$(mktemp -d)"
          export JWT_SECRET="$(openssl rand -hex 32)"
          export ADMIN_EMAIL="audit@example.test"
          export ADMIN_PASSWORD="CI-only-disposable-2026!"
          export PORT=3099 HOST=127.0.0.1 NODE_ENV=production
          cp -R packages/backend/src/db/migrations packages/backend/dist/db/migrations
          node packages/backend/dist/server.js > /tmp/homeledger-runtime.log 2>&1 &
          app_pid=$!
          trap 'kill "$app_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:3099/api/v1/health >/dev/null; then break; fi
            if ! kill -0 "$app_pid" 2>/dev/null; then
              cat /tmp/homeledger-runtime.log
              exit 1
            fi
            sleep 1
          done
          AUDIT_DISPOSABLE=true AUDIT_BASE_URL=http://127.0.0.1:3099 \
            AUDIT_EMAIL="$ADMIN_EMAIL" AUDIT_PASSWORD="$ADMIN_PASSWORD" \
            node scripts/check-runtime.mjs
