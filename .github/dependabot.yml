# Dependabot configuration — tuned to minimize PR noise.
# Weekly cadence, grouped PRs, and a capped open-PR limit so related bumps
# arrive together instead of one PR per package.
# Docs: https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
version: 2
updates:
  # --- npm (monorepo root; covers all workspaces under packages/*) ---
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    groups:
      # Roll all non-major updates into a single weekly PR.
      npm-minor-and-patch:
        update-types:
          - "minor"
          - "patch"
      # Keep majors grouped too, but separate so breaking bumps are reviewed on their own.
      npm-major:
        update-types:
          - "major"
    # These toolchain packages are tightly coupled (shared TypeScript peer,
    # Vite/Svelte/Vitest chain). A grouped auto major-bump fails to install
    # (e.g. typescript 7 vs typescript-eslint's peer typescript <6.1.0). Ignore
    # their MAJOR updates so Dependabot stops re-opening a broken PR; minor/patch
    # still flow. Upgrade these deliberately, together, on a dedicated branch,
    # then remove/relax the matching entries here.
    ignore:
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      - dependency-name: "typescript-eslint"
        update-types: ["version-update:semver-major"]
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@eslint/js"
        update-types: ["version-update:semver-major"]
      - dependency-name: "vite"
        update-types: ["version-update:semver-major"]
      - dependency-name: "vitest"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@sveltejs/vite-plugin-svelte"
        update-types: ["version-update:semver-major"]
      - dependency-name: "svelte"
        update-types: ["version-update:semver-major"]
      - dependency-name: "jsdom"
        update-types: ["version-update:semver-major"]
      - dependency-name: "tesseract.js"
        update-types: ["version-update:semver-major"]
      # Keep @types/node aligned with the Node LTS baseline (currently 22),
      # not chasing newer majors like 26.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  # --- Docker base images (main app + Home Assistant add-on) ---
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "docker"
    groups:
      docker:
        patterns:
          - "*"
    # Stay on the Node LTS line. Ignore major base-image bumps (e.g. 22 -> 26,
    # which is a Current/non-LTS release); still receive minor/patch updates.
    # Bumping the Node major is a deliberate, all-at-once change (CI + docs too).
    ignore:
      - dependency-name: "node"
        update-types:
          - "version-update:semver-major"

  - package-ecosystem: "docker"
    directory: "/ha-addon"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "docker"
    groups:
      docker-ha-addon:
        patterns:
          - "*"
    ignore:
      - dependency-name: "node"
        update-types:
          - "version-update:semver-major"

  # --- GitHub Actions used in workflows ---
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "github-actions"
    groups:
      github-actions:
        patterns:
          - "*"
